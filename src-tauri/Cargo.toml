[package]
name = "trackvault"
version = "0.1.0"
description = "TrackVault — local music library player"
authors = ["you"]
edition = "2021"
default-run = "trackvault"

[lib]
name = "trackvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "aac", "vorbis", "isomp4"] }
rodio = { version = "0.19", features = ["symphonia-mp3", "symphonia-flac", "symphonia-wav", "symphonia-aac", "symphonia-vorbis", "symphonia-isomp4"] }
walkdir = "2"
calamine = "0.26"
csv = "1"
thiserror = "2"
parking_lot = "0.12"
tar = "0.4"
flate2 = "1"
fake = { version = "2", features = ["derive"] }
rand = "0.8"

[[bin]]
name = "anonymize-library"
path = "src/bin/anonymize_library.rs"

[dev-dependencies]
rust_xlsxwriter = "0.79"
